name: Compiler AikoPipette

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. v1.0.1) — laisser vide pour juste compiler"
        required: false
        default: ""

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests automatiques
        shell: bash
        run: |
          mkdir -p screenshots
          python tests/smoke.py 2>&1 | tee screenshots/rapport.txt
      - name: Publier les captures et le rapport (branche captures-*)
        if: always()
        shell: bash
        run: |
          cd screenshots || exit 0
          git init -q -b "captures-${RUNNER_OS}"
          git -c user.name=ci -c user.email=ci@aikopipette add -A
          git -c user.name=ci -c user.email=ci@aikopipette commit -q -m "Captures ${RUNNER_OS}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:captures-${RUNNER_OS}"
      - name: Compilation (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name AikoPipette
          --icon ../assets/icon.ico
          --add-data "../assets/icon-256.png:assets"
          --collect-all pillow_heif
          run.py
      - name: Installateur (Inno Setup)
        shell: pwsh
        working-directory: .
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $env:AIKOPIPETTE_VERSION = (python -c "import sys; sys.path.insert(0, 'desktop'); import aikopipette; print(aikopipette.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\aikopipette.iss
          Compress-Archive -Path desktop\dist\AikoPipette -DestinationPath dist\AikoPipette-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AikoPipette-Windows
          path: |
            dist/AikoPipette-Windows-Setup.exe
            dist/AikoPipette-Windows-portable.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-windows
          path: desktop/screenshots

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 fonts-dejavu-core
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests automatiques
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p screenshots
          python tests/smoke.py 2>&1 | tee screenshots/rapport.txt
      - name: Publier les captures et le rapport (branche captures-*)
        if: always()
        shell: bash
        run: |
          cd screenshots || exit 0
          git init -q -b "captures-${RUNNER_OS}"
          git -c user.name=ci -c user.email=ci@aikopipette add -A
          git -c user.name=ci -c user.email=ci@aikopipette commit -q -m "Captures ${RUNNER_OS}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:captures-${RUNNER_OS}"
      - name: Compilation (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed --name AikoPipette
          --add-data "../assets/icon-256.png:assets"
          --collect-submodules Xlib
          --collect-all pillow_heif
          run.py
      - name: Archive
        working-directory: .
        run: |
          mkdir -p dist/pkg/AikoPipette-Linux
          cp -r desktop/dist/AikoPipette dist/pkg/AikoPipette-Linux/
          cp packaging/install-linux.sh dist/pkg/AikoPipette-Linux/installer.sh
          tar -C dist/pkg -czf dist/AikoPipette-Linux-x86_64.tar.gz AikoPipette-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: AikoPipette-Linux
          path: dist/AikoPipette-Linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-linux
          path: desktop/screenshots

  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compilation universelle (Apple Silicon + Intel)
        run: UNIVERSAL=1 ./macos/build.sh
      - name: Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent macos/build/AikoPipette.app dist/AikoPipette-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AikoPipette-Mac
          path: dist/AikoPipette-Mac.zip

  release:
    # Publie même si GitHub n'a pas de Mac disponible ce jour-là (Windows et Linux suffisent)
    if: >-
      always() && needs.windows.result == 'success' && needs.linux.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != ''))
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: AikoPipette-*
          merge-multiple: true
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          ls -la out
          set +e
          gh release create "${VERSION}" out/* --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "AikoPipette ${VERSION}" \
            --notes "AikoPipette — Windows (installateur ou portable), Mac (universel), Linux (x86_64)." > log.txt 2>&1
          code=$?
          cat log.txt
          if [ $code -ne 0 ]; then echo "::error title=gh release::$(tail -n 4 log.txt | tr '\n' ' ')"; exit 1; fi
